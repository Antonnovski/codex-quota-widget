name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore QuotaWidget.csproj

      - name: Build
        run: dotnet build QuotaWidget.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish QuotaWidget.csproj -c Release --no-build -o artifacts/CodexQuota

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: CodexQuota-win-x64
          path: artifacts/CodexQuota
